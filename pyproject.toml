[project]
name = "formex-api"
version = "0.1.0"
description = "Motor de generacion masiva de documentos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "email-validator>=2.0",
    "docxtpl>=0.18",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "aioboto3>=13.0",
    "celery[redis]>=5.4",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-openpyxl>=3.1.5.20260807",
    "types-aioboto3[s3]>=13.0",
    "celery-types>=0.26.0",
]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["docxtpl"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration' --cov=src/domain --cov-report=term-missing --cov-fail-under=100"
markers = [
    "integration: requiere infraestructura real (Postgres)",
]

[tool.coverage.run]
branch = true

[tool.uv]
package = false
