name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: formex
          POSTGRES_PASSWORD: formex
          POSTGRES_DB: formex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U formex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: formex
          MINIO_ROOT_PASSWORD: formex123
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      gotenberg:
        image: gotenberg/gotenberg:8
        ports:
          - 3000:3000
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+psycopg://formex:formex@localhost:5432/formex
      GOTENBERG_URL: http://localhost:3000
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: formex
      S3_SECRET_KEY: formex123
      S3_BUCKET: formex
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - name: Create MinIO bucket
        run: |
          docker run --rm --network host minio/mc:latest \
            sh -c "mc alias set local http://localhost:9000 formex formex123 && mc mb -p local/formex"
      - run: uv run pytest
      - run: uv run pytest -m integration --no-cov
      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t formex-api .
